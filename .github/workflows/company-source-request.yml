name: Apply recruitment source request

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: write
  issues: write

concurrency:
  group: recruitment-source-request
  cancel-in-progress: false

jobs:
  apply:
    if: startsWith(github.event.issue.title, '[招聘源]') && github.event.issue.author_association == 'OWNER'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate and apply request
        env:
          REQUEST_BODY: ${{ github.event.issue.body }}
        run: python scripts/apply_source_request.py

      - name: Commit configuration
        id: commit
        run: |
          if git diff --quiet -- config/sources.json config/profile.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/sources.json config/profile.json
          git commit -m "Update reviewed recruitment source"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Confirm and close request
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        run: |
          if [ "${{ steps.commit.outputs.changed }}" = "true" ]; then
            gh issue comment "$ISSUE_URL" --body "招聘网址已写入重点公司和每日监测配置。"
          else
            gh issue comment "$ISSUE_URL" --body "配置已是最新，无需重复修改。"
          fi
          gh issue close "$ISSUE_URL" --reason completed
